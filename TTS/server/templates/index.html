<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Dynamic TTS Player</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet">
    <style>
        textarea {
            height: 500px;
            width: 100%;
            resize: both;
            overflow: auto;
        }
    </style>
</head>
<body>
<div class="container text-center mt-4">
    <h1>TTS Demo</h1>
    <textarea id="text" placeholder="Type text here..."></textarea><br><br>
    <button id="speak-button">Speak</button>
    <p id="message"></p>
    <div id="audio-container"></div>
</div>

<script>
    function q(selector) { return document.querySelector(selector); }

    const lengths = [2, 4, 10, 25, 50, 100, 200, 400];
    const maxChunks = lengths.length + 1;
    console.log(lengths);
    const audioEls = [];

    // Create audio elements once
    function initAudioElements() { 
        const container = q('#audio-container');
        for (let i = 0; i < maxChunks; i++) {
            const audioEl = document.createElement("audio");
            audioEl.id = `audio${i + 1}`;
            audioEl.controls = true;
            audioEl.hidden = true;
            container.appendChild(audioEl);
            audioEls.push(audioEl);
        }

        // Chain playback
        for (let i = 0; i < maxChunks - 1; i++) {
            audioEls[i].addEventListener('ended', () => {
                if (!audioEls[i + 1].src) return;
                audioEls[i + 1].currentTime = 0;
                audioEls[i + 1].play();
            });
        }
    }

    function synthesize(text, speaker_id = "", style_wav = "", language_id = "", audioEl) {
        fetch(`/api/tts?text=${encodeURIComponent(text)}&speaker_id=${encodeURIComponent(speaker_id)}&style_wav=${encodeURIComponent(style_wav)}&language_id=${encodeURIComponent(language_id)}`, { cache: 'no-cache' })
            .then(res => {
                if (!res.ok) throw Error(res.statusText);
                return res.blob();
            })
            .then(blob => {
                q('#message').textContent = '';
                q('#speak-button').disabled = false;
                audioEl.src = URL.createObjectURL(blob);
                audioEl.hidden = false;
            })
            .catch(err => {
                q('#message').textContent = 'Error: ' + err.message;
                q('#speak-button').disabled = false;
            });
    }

    function synthesizeAll(text, speaker_id = "", style_wav = "", language_id = "") {
        const sentences = text.split(/[\n.]/).map(s => s.trim()).filter(s => s.length > 0);
        console.log("text sentence count: " + sentences.length);

        for (let i = 0; i < maxChunks; i++) {
            const start = i === 0 ? 0 : lengths[i - 1];
            const end = lengths[i] < lengths.length ? lengths[i] : sentences.length;
            console.log("progress: ", i, start, end);
            const chunk = sentences.slice(start, end).join(". ");

            const audioEl = audioEls[i];

            // Reset
            audioEl.hidden = true;
            audioEl.src = "";

            if (chunk.trim()) {
                audioEl.autoplay = (i === 0);
                synthesize(chunk, speaker_id, style_wav, language_id, audioEl);
            }
        }
    }

    function do_tts(e) {
        const text = q('#text').value;
        if (text.trim()) {
            q('#message').textContent = 'Synthesizing...';
            q('#speak-button').disabled = true;
            synthesizeAll(text);
        }
        e.preventDefault();
        return false;
    }

    window.addEventListener('DOMContentLoaded', () => {
        initAudioElements();
        q('#speak-button').addEventListener('click', do_tts);
        q('#text').addEventListener('keyup', function (e) {
            if (e.keyCode === 13) do_tts(e);
        });
    });
</script>


</body>
</html>
